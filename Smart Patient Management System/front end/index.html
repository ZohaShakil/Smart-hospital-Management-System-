<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Hospital Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Smart Hospital Management System</h1>

    <!-- Add Patient -->
    <div class="card">
        <h2>Add Patient</h2>
        <input type="number" id="pid" placeholder="Patient ID">
        <input type="text" id="pname" placeholder="Patient Name">
        <input type="number" id="severity" placeholder="Severity (1–10)">
        
        <select id="ptype">
            <option value="normal">Normal</option>
            <option value="emergency">Emergency</option>
        </select>

        <button onclick="addPatient()">Add Patient</button>
    </div>

    <!-- Actions -->
    <div class="card">
        <h2>Actions</h2>
        <button onclick="treatPatient()">Treat Next Patient</button>
        <button onclick="viewQueues()">View Queue Status</button>
    </div>

    <!-- Search -->
    <div class="card">
        <h2>Search Patient</h2>
        <input type="number" id="searchId" placeholder="Enter Patient ID">
        <button onclick="searchPatient()">Search</button>
    </div>

    <!-- Output -->
    <div class="output" id="output"></div>
</div>

<script src="script.js"></script>
<footer>
    <p> DSA Based Smart Hospital System | C++ Backend</p>
</footer>

</body>
</body>
</html>
